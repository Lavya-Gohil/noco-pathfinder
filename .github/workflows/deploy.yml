name: Deploy to GitHub Pages

# Manual on purpose: publishing changes what the public site tells people. To deploy on
# every merge instead, add `push: { branches: [main] }` under `on`.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # deploy.sh pushes from a fresh repo inside dist/, so the remote URL carries the token.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "360NoScopeGuru"
          git config user.email "vamsheedharan@gmail.com"
          bash scripts/deploy.sh
